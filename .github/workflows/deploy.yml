name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; les pushes rapides annulent le precedent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # L'action officielle fait deja : detection du lockfile, setup-node avec
      # cache npm, cache de node_modules/.astro (ce qui garde les transformations
      # sharp hors de chaque run), et upload-pages-artifact avec
      # include-hidden-files (ce qui fait survivre public/.nojekyll).
      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
          cache: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
